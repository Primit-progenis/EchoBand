<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">EchoBand Galaxy Watch screen preview</title>
  <desc id="desc">Illustrative preview of the EchoBand watch app interface, with a heart-rate tile, local relay fields, stream button and optional ECG controls.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1e2a"/><stop offset="1" stop-color="#23475a"/></linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#71828c"/><stop offset=".48" stop-color="#1c2b35"/><stop offset="1" stop-color="#52636c"/></linearGradient>
    <clipPath id="screen"><circle cx="600" cy="430" r="320"/></clipPath>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#backdrop)"/>
  <text x="600" y="58" fill="#eaf5f5" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5" text-anchor="middle">ECHOBAND · WATCH APP</text>
  <text x="600" y="88" fill="#a9c4cb" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Screen preview · Galaxy Watch</text>
  <g filter="url(#shadow)">
    <path d="M490 66 Q490 40 520 40 H680 Q710 40 710 66 L690 140 H510 Z" fill="#18232b" stroke="#83949c" stroke-width="4"/>
    <path d="M510 720 H690 L710 834 Q710 860 680 860 H520 Q490 860 490 834 Z" fill="#18232b" stroke="#83949c" stroke-width="4"/>
    <circle cx="600" cy="430" r="344" fill="url(#case)" stroke="#92a4aa" stroke-width="8"/>
    <circle cx="600" cy="430" r="328" fill="#07121a"/>
    <g clip-path="url(#screen)">
      <rect x="260" y="100" width="680" height="660" fill="#f2f7f9"/>
      <text x="600" y="160" fill="#162c3d" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="3" text-anchor="middle">ECHOBAND</text>
      <text x="600" y="187" fill="#6b7f8e" font-family="Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle">HOME FOLLOW-UP · WATCH LINK</text>
      <rect x="365" y="211" width="470" height="145" rx="20" fill="#fff" stroke="#dce7ec" stroke-width="2"/>
      <text x="395" y="246" fill="#6b7e8c" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">HEART RATE</text>
      <text x="395" y="305" fill="#162c3d" font-family="Arial,sans-serif" font-size="54" font-weight="700">—</text>
      <text x="464" y="304" fill="#6b7e8c" font-family="Arial,sans-serif" font-size="17">bpm · Watch reading</text>
      <rect x="365" y="374" width="470" height="220" rx="20" fill="#fff" stroke="#dce7ec" stroke-width="2"/>
      <text x="395" y="410" fill="#148b97" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.3">LAPTOP RELAY</text>
      <rect x="392" y="429" width="416" height="43" rx="10" fill="#f9fbfc" stroke="#d9e3e8"/>
      <text x="410" y="456" fill="#718492" font-family="Arial,sans-serif" font-size="14">Laptop IP address</text>
      <rect x="392" y="481" width="416" height="43" rx="10" fill="#f9fbfc" stroke="#d9e3e8"/>
      <text x="410" y="508" fill="#718492" font-family="Arial,sans-serif" font-size="14">Port</text><text x="772" y="508" fill="#263f4d" font-family="Arial,sans-serif" font-size="14" text-anchor="end">8787</text>
      <rect x="392" y="533" width="416" height="43" rx="10" fill="#f9fbfc" stroke="#d9e3e8"/>
      <text x="410" y="560" fill="#718492" font-family="Arial,sans-serif" font-size="14">Pairing code</text>
      <rect x="365" y="610" width="470" height="56" rx="18" fill="#148b97"/>
      <text x="600" y="645" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Start streaming</text>
      <rect x="365" y="682" width="470" height="100" rx="20" fill="#fff" stroke="#dce7ec" stroke-width="2"/>
      <text x="395" y="714" fill="#148b97" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.3">OPTIONAL ECG</text>
      <text x="395" y="739" fill="#6b7e8c" font-family="Arial,sans-serif" font-size="13">Availability checked when connected.</text>
      <text x="600" y="766" fill="#6b7e8c" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">Measure · 30 sec</text>
    </g>
    <circle cx="600" cy="430" r="320" fill="none" stroke="#9aabb1" stroke-opacity=".55" stroke-width="3"/>
  </g>
  <text x="600" y="890" fill="#a9c4cb" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">Illustrative preview of the app screen; shown inside a round watch display.</text>
</svg>
